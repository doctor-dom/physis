<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CDC calibration preview</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; background: #f0fdfa; }
      h1 { color: #134e4a; font-size: 1.25rem; }
      .grid { display: grid; gap: 2rem; }
      figure { margin: 0; max-width: 900px; }
      figcaption { margin-top: 0.5rem; color: #115e59; font-size: 0.9rem; }
      img, object { width: 100%; height: auto; border: 1px solid #99f6e4; border-radius: 8px; background: white; }
    </style>
  </head>
  <body>
    <h1>CDC chartManifest calibration previews</h1>
    <p>Generated by <code>npm run test:cdc-calibration</code>. Blue boxes = stature panel, green = weight panel.</p>
    <div class="grid">
      <figure>
        <object data="/cdc-calibration-male-advanced.svg" type="image/svg+xml"></object>
        <figcaption>Male — advanced bone age (10.5 y chron, 12 y bone, 138 cm, 32 kg, MPH 175 cm)</figcaption>
      </figure>
      <figure>
        <object data="/cdc-calibration-male-delayed.svg" type="image/svg+xml"></object>
        <figcaption>Male — delayed bone age (10.5 y chron, 8 y bone)</figcaption>
      </figure>
      <figure>
        <object data="/cdc-calibration-female.svg" type="image/svg+xml"></object>
        <figcaption>Female — typical adolescent (12 y chron, 11 y bone, 152 cm, 45 kg, MPS 163 cm)</figcaption>
      </figure>
    </div>
  </body>
</html>
